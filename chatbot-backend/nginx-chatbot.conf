# ─────────────────────────────────────────────────────────────────────────────
# Nginx — chatbot backend reverse proxy
#
# Add this server block to your existing nginx.conf on the VPS,
# OR save as /etc/nginx/sites-available/chatbot and symlink to sites-enabled/.
#
# This exposes the chatbot API at: https://chatbot.flowcrafted.me
# The widget is served at: https://chatbot.flowcrafted.me/widget/widget.js
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name chatbot.flowcrafted.me;

    # Let Certbot redirect to HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name chatbot.flowcrafted.me;

    ssl_certificate     /etc/letsencrypt/live/chatbot.flowcrafted.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatbot.flowcrafted.me/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Widget JS/CSS — serve with CORS so any website can load it
    location /widget/ {
        proxy_pass         http://127.0.0.1:8000/widget/;
        proxy_set_header   Host $host;
        add_header         Access-Control-Allow-Origin *;
        add_header         Cache-Control "public, max-age=3600";
    }

    # API — proxy with streaming support
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for Server-Sent Events (streaming)
        proxy_buffering          off;
        proxy_cache              off;
        proxy_read_timeout       300s;
        proxy_connect_timeout    10s;
        chunked_transfer_encoding on;
    }

    # Admin — restrict to your IP in production
    location /admin/ {
        # Uncomment to restrict by IP:
        # allow 1.2.3.4;
        # deny all;

        proxy_pass         http://127.0.0.1:8000/admin/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # API docs
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }

    # Health check (public, no auth)
    location = / {
        proxy_pass http://127.0.0.1:8000/;
    }
}
